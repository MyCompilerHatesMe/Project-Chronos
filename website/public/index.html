<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Chronos</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts for a nicer typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Custom styles for the app */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #111827; /* Dark gray background */
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom styles for the textarea placeholder */
    ::placeholder {
        color: #6b7280;
        opacity: 1; 
    }
    /* Custom styles for the button loading state */
    #generateBtn.loading {
      cursor: not-allowed;
      opacity: 0.7;
    }
    .loader {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #4f46e5;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="text-gray-200 antialiased">

  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl mx-auto">

      <!-- Header Section -->
      <header class="text-center mb-8">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-2">Project Chronos</h1>
        <p class="text-lg text-gray-400">Your AI assistant for reconstructing fragmented text.</p>
      </header>

      <!-- Main Content Area -->
      <main class="bg-gray-900/50 backdrop-blur-sm border border-gray-700/50 rounded-2xl shadow-lg p-6 md:p-8">
        
        <!-- Input Form -->
        <div class="space-y-4">
          <label for="promptInput" class="block text-sm font-medium text-gray-300">Enter your text fragment below:</label>
          <textarea id="promptInput" rows="6" class="w-full p-4 bg-gray-800 border border-gray-700 rounded-lg text-gray-200 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 resize-none" placeholder="e.g., '...the battle was lost, but not the war...'"></textarea>
          
          <div class="flex justify-end">
            <button id="generateBtn" class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition-all duration-300 ease-in-out transform hover:scale-105">
              <span id="btn-text">Reconstruct</span>
              <div id="loader" class="loader hidden"></div>
            </button>
          </div>
        </div>

        <!-- Divider -->
        <div class="my-8 border-t border-gray-700/50"></div>
        
        <!-- Response Area -->
        <div>
          <h2 class="text-xl font-semibold text-white mb-4">Reconstructed Report:</h2>
          <div id="responseContainer" class="bg-gray-800 border border-gray-700 rounded-lg p-4 min-h-[150px]">
            <p id="responseOutput" class="text-gray-300 whitespace-pre-wrap font-mono">Your reconstructed text will appear here...</p>
          </div>
        </div>

      </main>

      <!-- Footer -->
      <footer class="text-center mt-8 text-gray-500 text-sm">
        <p>Powered by Gemini</p>
      </footer>
    </div>
  </div>

  <script src="frontend.js"></script>

</body>
</html>
